<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>魚判定</title>
<meta name="theme-color" content="#0b4f6c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="魚判定">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
:root {
  --bg: #f4f8fa; --surface: #ffffff; --surface-2: #eaf2f5; --text: #15262d; --muted: #63757d;
  --line: #d8e5ea; --brand: #0f7c99; --brand-dark: #0b4f6c; --brand-light: #2bb3c0;
  --ok-bg: #dff5ea; --ok: #136c3f; --mid-bg: #fff1d6; --mid: #8a5a00; --lo-bg: #fde2e2; --lo: #9b1c1c;
  --shadow: 0 4px 18px rgba(11, 79, 108, .10); --on-brand: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c171c; --surface: #13232a; --surface-2: #1b3039; --text: #e6f0f3; --muted: #93a7af;
    --line: #26404b; --brand: #3cc4d1; --ok-bg: #143a2a; --ok: #8fe0b5; --mid-bg: #3d2f12; --mid: #f3cd7f;
    --lo-bg: #42191b; --lo: #f5a3a3; --shadow: 0 4px 18px rgba(0, 0, 0, .35); --on-brand: #062a33;
  }
}
:root[data-theme="dark"] {
  --bg: #0c171c; --surface: #13232a; --surface-2: #1b3039; --text: #e6f0f3; --muted: #93a7af;
  --line: #26404b; --brand: #3cc4d1; --ok-bg: #143a2a; --ok: #8fe0b5; --mid-bg: #3d2f12; --mid: #f3cd7f;
  --lo-bg: #42191b; --lo: #f5a3a3; --shadow: 0 4px 18px rgba(0, 0, 0, .35); --on-brand: #062a33;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: "Noto Sans JP", system-ui, sans-serif;
       -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
.app { max-width: 520px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }

/* 上部バー */
.appbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px;
          padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
          background: linear-gradient(135deg, var(--brand-dark), var(--brand) 60%, var(--brand-light));
          color: #fff; }
.appbar img { width: 30px; height: 30px; border-radius: 8px; }
.appbar h1 { margin: 0; font-size: 1.25rem; font-weight: 900; letter-spacing: .12em; }
.appbar .back { margin-left: auto; background: rgba(255,255,255,.18); border: 0; color: #fff;
                border-radius: 99px; padding: 6px 14px; font-size: .85rem; }

main { flex: 1; padding: 16px 16px 96px; }
.screen { display: none; animation: fade .25s ease; }
.screen.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
        box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
.section-title { font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .08em; margin: 4px 4px 8px; }

/* 水族館の選択 */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; margin-bottom: 14px;
         scrollbar-width: none; }
.chip { flex-shrink: 0; border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px;
        padding: 8px 16px; font-size: .9rem; font-weight: 500; }
.chip.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }

/* 撮影カード */
.shoot { text-align: center; padding: 28px 18px; border: 2px dashed var(--line); transition: border-color .2s; }
.shoot.drag { border-color: var(--brand); background: var(--surface-2); }
.shoot .lead { font-size: 1.15rem; font-weight: 700; margin: 6px 0 4px; }
.shoot .sub { color: var(--muted); font-size: .85rem; margin: 0 0 18px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
       border: 0; border-radius: 16px; padding: 15px; font-size: 1.05rem; font-weight: 700; }
.btn + .btn { margin-top: 10px; }
.btn-primary { background: linear-gradient(135deg, var(--brand-dark), var(--brand)); color: #fff;
               box-shadow: 0 6px 16px rgba(15, 124, 153, .35); }
.btn-secondary { background: var(--surface-2); color: var(--text); }
.btn svg { width: 22px; height: 22px; }
.pc-hint { display: none; color: var(--muted); font-size: .8rem; margin-top: 12px; }
@media (hover: hover) { .pc-hint { display: block; } }

.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.step .num { width: 30px; height: 30px; margin: 0 auto 6px; border-radius: 50%; display: grid;
             place-items: center; background: var(--surface-2); color: var(--brand); font-weight: 900; }
.step p { margin: 0; font-size: .8rem; line-height: 1.4; }
.tips { margin: 0; padding-left: 1.2em; font-size: .88rem; line-height: 1.8; }

/* 判定中 */
.scan { position: relative; border-radius: 20px; overflow: hidden; background: #000; }
.scan img { display: block; width: 100%; max-height: 60vh; object-fit: contain; opacity: .85; }
.scan::after { content: ""; position: absolute; left: 0; right: 0; height: 30%;
               background: linear-gradient(180deg, transparent, rgba(43, 179, 192, .55), transparent);
               animation: sweep 1.6s ease-in-out infinite; }
@keyframes sweep { from { top: -30%; } to { top: 100%; } }
.loading-text { text-align: center; margin-top: 18px; font-weight: 700; }
.loading-text small { display: block; color: var(--muted); font-weight: 400; margin-top: 4px; }

/* 結果 */
.verdict { text-align: center; padding: 20px 18px 16px; }
.verdict .pre { color: var(--muted); font-size: .9rem; }
.verdict .name { font-size: 2rem; font-weight: 900; line-height: 1.25; margin: 4px 0; word-break: keep-all; overflow-wrap: anywhere; }
.verdict .post { font-size: .95rem; }
.pill { display: inline-block; border-radius: 99px; padding: 4px 12px; font-size: .8rem; font-weight: 700; margin-top: 10px; }
.pill.hi { background: var(--ok-bg); color: var(--ok); }
.pill.mid { background: var(--mid-bg); color: var(--mid); }
.pill.lo { background: var(--lo-bg); color: var(--lo); }
.meter { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 12px auto 0; max-width: 260px; }
.meter > div { height: 100%; background: linear-gradient(90deg, var(--brand), var(--brand-light)); border-radius: 99px; }

.warn { background: var(--mid-bg); color: var(--mid); border-radius: 16px; padding: 12px 14px; margin-bottom: 16px; font-size: .9rem; }

.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.compare figure { margin: 0; }
.compare .ph { aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--surface-2);
               display: grid; place-items: center; color: var(--muted); font-size: .8rem; }
.compare img { width: 100%; height: 100%; object-fit: cover; display: block; }
.compare figcaption { text-align: center; font-size: .78rem; color: var(--muted); margin-top: 6px; }
.compare figcaption .credit { display: block; font-size: .62rem; opacity: .8; margin-top: 2px;
                              overflow-wrap: anywhere; line-height: 1.3; }
.compare-note { font-size: .8rem; color: var(--muted); text-align: center; margin: 10px 0 0; }

.tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 8px 0 6px; }
.tags span { background: var(--surface-2); color: var(--brand); border-radius: 99px; padding: 3px 11px;
             font-size: .8rem; font-weight: 700; }
.mame { text-align: left; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; margin-top: 16px; }
.mame-title { font-weight: 700; font-size: .85rem; margin-bottom: 4px; }
.mame ul { margin: 0; padding-left: 1.2em; line-height: 1.7; font-size: .92rem; }
.mame-wiki { margin: 0; font-size: .9rem; line-height: 1.7; }
.mame-wiki a { color: var(--muted); font-size: .8rem; }
.cand-name { font-weight: 900; font-size: 1.3rem; text-align: center; margin-top: 14px; }
.more { margin: 14px 0; font-size: .9rem; }
.more summary { cursor: pointer; color: var(--muted); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .9rem; margin: 14px 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { flex: 1 1 auto; text-align: center; text-decoration: none; border: 1.5px solid var(--line);
           border-radius: 12px; padding: 9px 10px; font-size: .85rem; font-weight: 500; }
.links a:hover { border-color: var(--brand); color: var(--brand); }

.cand { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
        background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px;
        padding: 8px; margin-bottom: 8px; }
.cand.on { border-color: var(--brand); box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 25%, transparent); }
.cand .th { width: 64px; height: 52px; border-radius: 10px; overflow: hidden; flex-shrink: 0;
            background: var(--surface-2); display: grid; place-items: center; }
.cand .th img { width: 100%; height: 100%; object-fit: cover; }
.cand .tx { flex: 1; min-width: 0; }
.cand .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cand .sc { font-size: .78rem; color: var(--muted); font-style: italic; }
.cand .pc { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--brand); padding-right: 6px; }

/* 履歴 */
.hist-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.hist { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
        padding: 0; text-align: left; }
.hist img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: var(--surface-2); }
.hist .tx { padding: 8px 10px 10px; }
.hist .nm { font-weight: 700; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist .meta { font-size: .72rem; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 48px 12px; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: .85rem;
           display: block; margin: 18px auto 0; }

/* 下部タブ */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center;
          background: var(--surface); border-top: 1px solid var(--line);
          padding-bottom: env(safe-area-inset-bottom); }
.tabbar .in { display: flex; width: 100%; max-width: 520px; }
.tab { flex: 1; background: none; border: 0; padding: 8px 0 10px; color: var(--muted); font-size: .72rem; font-weight: 500; }
.tab svg { display: block; width: 24px; height: 24px; margin: 0 auto 2px; }
.tab.on { color: var(--brand); }

/* AI の準備（初回ダウンロード） */
.prep { border: 2px solid var(--brand); }
.prep h2 { margin: 0 0 6px; font-size: 1.05rem; }
.prep p { margin: 0 0 12px; font-size: .88rem; color: var(--muted); line-height: 1.6; }
.prep .bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
.prep .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--brand), var(--brand-light));
                   border-radius: 99px; transition: width .3s; }
.prep .bar.busy > div { width: 35%; animation: busy 1.2s ease-in-out infinite alternate; }
@keyframes busy { from { margin-left: 0; } to { margin-left: 65%; } }
.prep .num { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #15262d; color: #fff;
         padding: 10px 16px; border-radius: 12px; font-size: .88rem; display: none; z-index: 20; max-width: 90vw; }
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <img src="icon.svg" alt="">
    <h1>魚判定</h1>
    <button class="back" id="backBtn" hidden>← もどる</button>
  </header>

  <main>
    <!-- ホーム -->
    <section class="screen active" id="home">
      <div class="section-title">どこの水族館？</div>
      <div class="chips" id="chips"></div>

      <div class="card prep" id="prep" hidden></div>

      <div class="card shoot" id="drop">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--brand)"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>
        <p class="lead">魚の写真で、名前を調べよう</p>
        <p class="sub">撮った写真から AI が種類を推定します</p>
        <button class="btn btn-primary" id="cameraBtn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>
          写真を撮る
        </button>
        <button class="btn btn-secondary" id="albumBtn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
          アルバムから選ぶ
        </button>
        <p class="pc-hint">パソコンなら、ここに写真をドラッグしてもOK</p>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
        <input type="file" id="albumInput" accept="image/*" hidden>
      </div>

      <div class="card">
        <div class="steps">
          <div class="step"><div class="num">1</div><p>魚の写真を<br>撮る・選ぶ</p></div>
          <div class="step"><div class="num">2</div><p>AI が<br>種類を判定</p></div>
          <div class="step"><div class="num">3</div><p>図鑑の写真と<br>見比べる</p></div>
        </div>
      </div>

      <div class="card">
        <div class="section-title" style="margin-top:0">上手に撮るコツ</div>
        <ul class="tips">
          <li>魚を画面いっぱいに、横向きで</li>
          <li>ガラスにレンズを近づけて映り込みを防ぐ</li>
          <li>フラッシュは OFF（魚にもやさしい）</li>
          <li>水族館を選ぶと、その館の魚にしぼって判定</li>
        </ul>
      </div>
    </section>

    <!-- 判定中 -->
    <section class="screen" id="loading">
      <div class="scan"><img id="loadingImg" alt="判定中の写真"></div>
      <p class="loading-text">AI が判定しています…<small>スマホの中で計算しています（10秒ほど）</small></p>
    </section>

    <!-- 結果 -->
    <section class="screen" id="result"></section>

    <!-- 履歴 -->
    <section class="screen" id="history"></section>
  </main>
</div>

<nav class="tabbar"><div class="in">
  <button class="tab on" data-tab="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>判定する</button>
  <button class="tab" data-tab="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>履歴</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const HIST_KEY = "fishid.history.v1";
const AQ_KEY = "fishid.aquarium";
let aquariums = [], currentAq = "", lastScreen = "home";

// ---------- 小さなDOMヘルパー（データは textContent で入れる） ----------
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c);
  return e;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = "none", 3500);
}

// ---------- 画面切り替え ----------
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on",
    t.dataset.tab === (id === "history" ? "history" : "home")));
  $("#backBtn").hidden = id !== "result";
  if (id !== "result") lastScreen = id;
  window.scrollTo({ top: 0 });
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  if (t.dataset.tab === "history") renderHistory();
  show(t.dataset.tab);
}));
$("#backBtn").addEventListener("click", () => {
  if (lastScreen === "history") renderHistory();
  show(lastScreen === "loading" ? "home" : lastScreen);
});

// ---------- 水族館の選択 ----------
async function loadAquariums() {
  aquariums = [{ id: "", label: "指定なし" }, ...Object.keys(LISTS).map(k => ({ id: k, label: k }))];
  const saved = store.get(AQ_KEY, "");
  currentAq = aquariums.some(a => a.id === saved) ? saved : "";
  renderChips();
}
function aqLabel(id) {
  if (!id) return "指定なし";
  return (aquariums.find(a => a.id === id) || { label: id.replace(/\.csv$/, "") }).label;
}
function renderChips() {
  $("#chips").replaceChildren(...aquariums.map(a => el("button", {
    class: "chip" + (a.id === currentAq ? " on" : ""), text: a.id ? a.label : "指定なし（すべての魚）",
    onclick: () => { currentAq = a.id; store.set(AQ_KEY, a.id); renderChips(); },
  })));
}

// ---------- 写真の入力 ----------
$("#cameraBtn").addEventListener("click", () => $("#cameraInput").click());
$("#albumBtn").addEventListener("click", () => $("#albumInput").click());
for (const id of ["#cameraInput", "#albumInput"]) {
  $(id).addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) identify(f); });
}
const drop = $("#drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("drag"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("drag"); }));
drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) identify(f); });
document.addEventListener("paste", e => {
  const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith("image/"));
  if (f && $("#home").classList.contains("active")) identify(f);
});

// 送る前に縮小（速く・軽く）
async function shrink(file, max, quality) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = el("canvas", { width: Math.round(bmp.width * s), height: Math.round(bmp.height * s) });
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", quality));
}
const toDataURL = (blob) => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });

// モデル入力: 224x224 に縮小（縦横比は無視）→ CLIP の平均・標準偏差で正規化した CHW 配列
async function toPixels(file) {
  const size = META.size;
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  // 一気に縮めるとギザギザになるので、2段階で縮小する
  let src = bmp;
  if (Math.max(bmp.width, bmp.height) > size * 4) {
    const s = size * 2 / Math.min(bmp.width, bmp.height);
    src = el("canvas", { width: Math.round(bmp.width * s), height: Math.round(bmp.height * s) });
    const g = src.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(bmp, 0, 0, src.width, src.height);
  }
  const c = el("canvas", { width: size, height: size });
  const g = c.getContext("2d", { willReadFrequently: true });
  g.imageSmoothingQuality = "high";
  g.drawImage(src, 0, 0, size, size);
  const rgba = g.getImageData(0, 0, size, size).data, n = size * size, out = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) for (let ch = 0; ch < 3; ch++)
    out[ch * n + i] = (rgba[i * 4 + ch] / 255 - META.mean[ch]) / META.std[ch];
  return out;
}

async function identify(file) {
  if (!engineReady) { toast("AI の準備ができてから写真を選んでください"); return; }
  let pixels, thumb, preview;
  try {
    pixels = await toPixels(file);
    const small = await shrink(file, 400, .75);
    thumb = await toDataURL(small);
    preview = URL.createObjectURL(await shrink(file, 1024, .85));
  } catch {
    toast("この写真は読み込めませんでした。別の写真で試してください"); return;
  }
  $("#loadingImg").src = preview;
  show("loading");
  try {
    const r = await engineCall({ type: "identify", pixels, list: currentAq, k: 5 }, [pixels.buffer]);
    const data = await buildResult(r);
    const item = { id: Date.now(), aq: currentAq, thumb, result: data };
    saveHistory(item);
    renderResult(item);
    lastScreen = "home";
    show("result");
  } catch (err) {
    show("home");
    toast("判定できませんでした（" + err.message + "）");
  }
}

// エンジンの結果（行番号と確率）を、画面用のデータ（名前・写真・リンク・豆知識）にする
async function buildResult(r) {
  const fams = new Map();
  r.all.idx.forEach((row, j) => { const f = FISH[row].f || "?"; fams.set(f, (fams.get(f) || 0) + r.all.probs[j]); });
  const families = [...fams].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([family, score]) => ({ family, score }));
  const rows = r.species.map(s => FISH[s.row]);
  const [ja, refs] = await Promise.all([japaneseNames(rows), references(rows)]);
  const species = r.species.map((s, i) => {
    const f = rows[i], ref = refs[f.s] || {}, j = ja[f.s] || "";
    const photo = ref.photo || "";
    return {
      ja: j, common: f.c, scientific: f.s, family: f.f, score: s.score, credit: ref.credit || "",
      photo, photo_large: photo.replace("/medium.", "/large."),
      links: links(f.s, j, ref), trivia: TRIVIA[f.s] || null,
    };
  });
  return { fish_score: r.fish_score, species, families, ms: r.ms };
}

// ---------- 和名・参考写真（オンライン時のみ取得し、端末に保存） ----------
const JA_KEY = "fishid.ja", REF_KEY = "fishid.ref";
async function japaneseNames(rows) {
  const cache = store.get(JA_KEY, {}), out = {};
  const todo = rows.filter(f => !f.j && !(f.s in cache)).map(f => f.s);
  if (todo.length && navigator.onLine) {
    const values = todo.map(n => JSON.stringify(n)).join(" ");
    const q = `SELECT ?n ?ja WHERE { VALUES ?n { ${values} } ?t wdt:P225 ?n . ?t rdfs:label ?ja FILTER(LANG(?ja)="ja") }`;
    try {
      const ctl = new AbortController(); setTimeout(() => ctl.abort(), 6000);
      const res = await fetch("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(q), { signal: ctl.signal });
      const found = Object.fromEntries((await res.json()).results.bindings.map(b => [b.n.value, b.ja.value]));
      for (const n of todo) cache[n] = found[n] || "";
      store.set(JA_KEY, cache);
    } catch { /* オフライン等。英名で表示する */ }
  }
  for (const f of rows) out[f.s] = f.j || cache[f.s] || "";
  return out;
}
async function references(rows) {
  const cache = store.get(REF_KEY, {}), out = {};
  for (const f of rows) if (f.p) out[f.s] = { id: f.t, photo: f.p, credit: f.a };
  const todo = rows.filter(f => !out[f.s] && !(f.s in cache));
  if (todo.length && navigator.onLine) {
    await Promise.all(todo.map(async f => {
      try {
        const res = await fetch("https://api.inaturalist.org/v1/taxa?per_page=5&q=" + encodeURIComponent(f.s));
        const t = (await res.json()).results.find(t => t.name === f.s);
        cache[f.s] = t ? { id: t.id, photo: t.default_photo?.medium_url || "" } : {};
      } catch { /* 取得できなければ写真なし */ }
    }));
    store.set(REF_KEY, cache);
  }
  for (const f of rows) out[f.s] = out[f.s] || cache[f.s] || (f.t ? { id: f.t } : {});
  return out;
}
function links(sci, ja, ref) {
  const out = [];
  if (ref.id) out.push({ label: "写真をもっと見る", url: `https://www.inaturalist.org/taxa/${ref.id}/browse_photos` });
  out.push({ label: "Wikipedia", url: "https://ja.wikipedia.org/w/index.php?search=" + encodeURIComponent(ja || sci) });
  out.push({ label: "FishBase", url: "https://www.fishbase.se/summary/" + sci.replace(" ", "-") });
  return out;
}

// ---------- 判定エンジン（Web Worker）と初回準備 ----------
let META, FISH, LISTS, TRIVIA, engine, engineReady = false;
const pending = new Map();
let callId = 0;
function engineCall(msg, transfer) {
  return new Promise((resolve, reject) => {
    const id = ++callId; pending.set(id, { resolve, reject });
    engine.postMessage({ ...msg, id }, transfer || []);
  });
}
const MB = (b) => (b / 1e6).toFixed(0);
function setButtons(on) { $("#cameraBtn").disabled = $("#albumBtn").disabled = !on; }

function renderPrep(state, info = {}) {
  const box = $("#prep");
  box.hidden = state === "ready";
  if (state === "ready") return;
  if (state === "ask") {
    box.replaceChildren(
      el("h2", { text: "はじめに AI を準備します" }),
      el("p", { text: `判定に使う AI のデータ（約${MB(info.total)}MB）を一度だけダウンロードします。Wi-Fi でのご利用をおすすめします。2回目からはすぐ使え、電波がなくても判定できます。` }),
      el("button", { class: "btn btn-primary", text: "ダウンロードして準備する", onclick: () => startEngine(true) }));
  } else if (state === "download") {
    const pct = info.total ? info.loaded / info.total * 100 : 0;
    box.replaceChildren(el("h2", { text: "AI をダウンロード中…" }),
      el("div", { class: "bar" }, el("div", { style: `width:${pct.toFixed(1)}%` })),
      el("div", { class: "num", text: `${MB(info.loaded)} / ${MB(info.total)} MB（${pct.toFixed(0)}%）` }),
      el("p", { style: "margin:8px 0 0", text: "この画面のままお待ちください" }));
  } else if (state === "init") {
    box.replaceChildren(el("h2", { text: "AI を起動しています…" }), el("div", { class: "bar busy" }, el("div")),
      el("p", { style: "margin:8px 0 0", text: "10〜30秒ほどかかります" }));
  } else if (state === "error") {
    box.replaceChildren(el("h2", { text: "AI を準備できませんでした" }),
      el("p", { text: info.message === "not-cached" ? "データがまだ保存されていません。" : `（${info.message}）通信状況を確かめて、もう一度お試しください。` }),
      el("button", { class: "btn btn-primary", text: "もう一度試す", onclick: () => startEngine(true) }));
  }
}

function startEngine(allowDownload) {
  setButtons(false);
  renderPrep(allowDownload ? "download" : "init", { loaded: 0, total: META.download_bytes });
  engine.postMessage({ type: "load", allowDownload });
  if (allowDownload) navigator.storage?.persist?.().catch(() => {});
}

async function boot() {
  [META, FISH, LISTS, TRIVIA] = await Promise.all(
    ["data/meta.json", "data/fish.json", "data/lists.json", "data/trivia.json"].map(u => fetch(u).then(r => r.json())));
  loadAquariums();
  engine = new Worker("engine-worker.js");
  engine.onmessage = ({ data }) => {
    if (data.type === "status") data.cached ? startEngine(false) : (setButtons(false), renderPrep("ask", data));
    else if (data.type === "progress") renderPrep("download", data);
    else if (data.type === "phase") renderPrep("init");
    else if (data.type === "ready") { engineReady = true; setButtons(true); renderPrep("ready"); console.log("engine ready", data); }
    else if (data.type === "result") { pending.get(data.id)?.resolve(data); pending.delete(data.id); }
    else if (data.type === "error") {
      if (data.id && pending.has(data.id)) { pending.get(data.id).reject(new Error(data.message)); pending.delete(data.id); }
      else renderPrep("error", data);
    }
  };
  engine.onerror = (e) => renderPrep("error", { message: e.message || "worker error" });
  engine.postMessage({ type: "status" });
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

// ---------- 結果 ----------
const displayName = (s) => s.ja || s.common || s.scientific;
function confidence(p) {
  if (p >= .6) return { cls: "hi", pill: "ほぼ確実", pre: "この魚は", post: "です" };
  if (p >= .25) return { cls: "mid", pill: "たぶん", pre: "この魚は たぶん", post: "です" };
  return { cls: "lo", pill: "自信なし", pre: "もしかすると", post: "かもしれません。下の候補とも見比べてください" };
}

// ---------- 豆知識 ----------
function tagRow(s) {
  const tags = s.trivia?.tags || [];
  return tags.length ? el("div", { class: "tags" }, tags.map(t => el("span", { text: t }))) : null;
}
const wikiCache = new Map();
async function wikiSummary(title) {
  if (!wikiCache.has(title)) wikiCache.set(title, (async () => {
    const r = await fetch("https://ja.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title));
    if (!r.ok) return null;
    const j = await r.json();
    if (j.type !== "standard" || !j.extract) return null;
    // 最初の2文まで
    const sentences = j.extract.match(/[^。]+。/g) || [j.extract];
    return { text: sentences.slice(0, 2).join(""), url: j.content_urls?.mobile?.page || j.content_urls?.desktop?.page };
  })().catch(() => null));
  return wikiCache.get(title);
}
function triviaBox(s) {
  const facts = s.trivia?.facts || [];
  const box = el("div", { class: "mame" }, el("div", { class: "mame-title", text: "💡 豆知識" }));
  if (facts.length) {
    box.append(el("ul", {}, facts.map(f => el("li", { text: f }))));
    return box;
  }
  if (!s.ja) return null;
  // 豆知識データがない魚は Wikipedia の冒頭を表示（ネット接続時のみ）
  const body = el("p", { class: "mame-wiki", text: "読み込み中…" });
  box.append(body);
  wikiSummary(s.ja).then(w => {
    if (!w) { box.remove(); return; }
    body.replaceChildren(w.text, " ", el("a", { href: w.url, target: "_blank", rel: "noopener", text: "（Wikipediaより）" }));
  });
  return box;
}

function renderResult(item) {
  const r = item.result, sp = r.species;
  const top = sp[0], conf = confidence(top.score);
  const root = $("#result");
  const parts = [];

  if (r.fish_score < .5) parts.push(el("div", { class: "warn" },
    el("b", { text: "魚が写っていないかもしれません。" }),
    "クラゲやペンギンなど魚以外の生きものは判定できません。"));

  parts.push(el("div", { class: "card verdict" },
    el("div", { class: "pre", text: conf.pre }),
    el("div", { class: "name", text: displayName(top) }),
    tagRow(top),
    el("div", { class: "post", text: conf.post }),
    el("span", { class: "pill " + conf.cls, text: `${conf.pill}（${(top.score * 100).toFixed(0)}%）` }),
    el("div", { class: "meter" }, el("div", { style: `width:${Math.max(top.score * 100, 2)}%` })),
    triviaBox(top),
  ));

  // 見比べ & 詳細（候補をタップで切り替え）
  const detail = el("div", { class: "card" });
  const candList = el("div");
  function select(i) {
    const s = sp[i];
    detail.replaceChildren(
      el("div", { class: "section-title", style: "margin-top:0", text: i === 0 ? "見比べてみよう" : `候補 ${i + 1} と見比べる` }),
      el("div", { class: "compare" },
        el("figure", {}, el("div", { class: "ph" }, el("img", { src: item.thumb, alt: "あなたの写真" })),
          el("figcaption", { text: "あなたの写真" })),
        el("figure", {}, el("a", { class: "ph", href: s.photo_large || null, target: "_blank", rel: "noopener" },
            s.photo ? el("img", { src: s.photo, alt: displayName(s), loading: "lazy" }) : "写真なし"),
          el("figcaption", { text: displayName(s) + " の写真" },
            s.credit ? el("span", { class: "credit", text: s.credit }) : null))),
      el("p", { class: "compare-note", text: "右の写真をタップすると大きく表示します" }),
      i > 0 ? [el("div", { class: "cand-name", text: displayName(s) }), tagRow(s), triviaBox(s)] : null,
      el("details", { class: "more" },
        el("summary", { text: "くわしい情報（学名・科）" }),
        el("dl", { class: "facts" },
          el("dt", { text: "学名" }), el("dd", {}, el("i", { text: s.scientific })),
          s.common && s.ja ? [el("dt", { text: "英名" }), el("dd", { text: s.common })] : null,
          el("dt", { text: "科" }), el("dd", { text: s.family || "—" }),
          el("dt", { text: "確率" }), el("dd", { text: (s.score * 100).toFixed(1) + "%" }))),
      el("div", { class: "links" }, s.links.map(l =>
        el("a", { href: l.url, target: "_blank", rel: "noopener", text: l.label + " ↗" }))),
    );
    candList.querySelectorAll(".cand").forEach((c, j) => c.classList.toggle("on", j === i));
  }
  sp.forEach((s, i) => candList.append(el("button", { class: "cand", onclick: () => { select(i); detail.scrollIntoView({ behavior: "smooth", block: "start" }); } },
    el("div", { class: "th" }, s.photo ? el("img", { src: s.photo, alt: "", loading: "lazy" }) : "🐟"),
    el("div", { class: "tx" }, el("div", { class: "nm", text: `${i + 1}. ${displayName(s)}` }),
      el("div", { class: "sc", text: s.scientific })),
    el("div", { class: "pc", text: (s.score * 100).toFixed(0) + "%" }))));

  parts.push(detail);
  parts.push(el("div", { class: "section-title", text: "候補一覧（タップで見比べ）" }), candList);
  parts.push(el("p", { class: "compare-note", text: `判定範囲: ${aqLabel(item.aq)} ・ ${new Date(item.id).toLocaleString("ja-JP")}` }));
  parts.push(el("button", { class: "btn btn-primary", style: "margin-top:16px", text: "別の写真を判定する",
    onclick: () => show("home") }));
  root.replaceChildren(...parts);
  select(0);
}

// ---------- 履歴 ----------
function saveHistory(item) {
  let h = store.get(HIST_KEY, []);
  h.unshift(item); h = h.slice(0, 40);
  while (h.length && !store.set(HIST_KEY, h)) h.pop();  // 容量オーバーなら古い順に削る
}
function renderHistory() {
  const h = store.get(HIST_KEY, []);
  const root = $("#history");
  if (!h.length) {
    root.replaceChildren(el("div", { class: "empty" },
      el("div", { style: "font-size:2.5rem", text: "🐠" }), el("p", { text: "まだ判定した写真はありません" })));
    return;
  }
  root.replaceChildren(
    el("div", { class: "section-title", text: `これまでの判定（${h.length}件）` }),
    el("div", { class: "hist-grid" }, h.map(item => {
      const top = item.result.species[0];
      return el("button", { class: "hist", onclick: () => { renderResult(item); lastScreen = "history"; show("result"); } },
        el("img", { src: item.thumb, alt: "" }),
        el("div", { class: "tx" }, el("div", { class: "nm", text: displayName(top) }),
          el("div", { class: "meta", text: `${new Date(item.id).toLocaleDateString("ja-JP")} ・ ${aqLabel(item.aq)}` })));
    })),
    el("button", { class: "linkish", text: "履歴をすべて消す", onclick: () => {
      if (confirm("判定の履歴をすべて消しますか？")) { store.set(HIST_KEY, []); renderHistory(); }
    } }),
  );
}

boot().catch(e => renderPrep("error", { message: e.message }));
</script>
